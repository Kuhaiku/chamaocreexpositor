<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vitrine Digital</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4a2511">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000; 
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            overflow: hidden; font-family: 'Playfair Display', serif; display: flex; align-items: center; justify-content: center;
        }
        #startScreen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(74, 37, 17, 0.95); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 24px; z-index: 1000; cursor: pointer;
        }
        .layout-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; z-index: 1; background-color: #fff; background-size: 100% 100%; background-position: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6vh 4vw; width: 80%; height: 65%; }
        .card { display: flex; align-items: center; justify-content: flex-start; gap: 1.5vw; }
        .card img { width: 18vh; height: 18vh; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 1px solid #ddd; }
        .card h3 { font-size: 5vh; margin: 0; color: #4a2511; white-space: nowrap; }

        #promoContainer { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50; background: #000; cursor: pointer; }
        #promoImg, #promoVideo { width: 100%; height: 100%; object-fit: contain; display: none; }
        video#video, canvas#canvas { display: none; }

        #fullscreenBtn {
            position: absolute; bottom: 20px; right: 20px; padding: 12px 20px;
            background: rgba(74, 37, 17, 0.85); color: white; border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            z-index: 100; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body onclick="resetCatalogTimer()">
    <div id="startScreen" onclick="startApp()"><h2>Toque para Iniciar a Vitrine</h2></div>
    
    <div class="layout-wrapper" id="layoutBg"><div class="grid" id="catalog"></div></div>
    
    <div id="promoContainer">
        <img id="promoImg">
        <video id="promoVideo" muted playsinline></video>
    </div>

    <button id="fullscreenBtn" onclick="enterFullscreen()">⛶ Tela Cheia</button>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(e=>{});
        const socket = io(); 
        let isAppStarted = false, wakeLock = null, promoItems = [], promoIndex = 0, isPromoActive = false;
        let catalogTimer, imageTimer;
        
        let idleDelay = 60000; // Tempo até iniciar o descanso

        async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
        document.addEventListener('visibilitychange', async () => { if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock(); });

        function enterFullscreen() {
            let elem = document.documentElement; 
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(e=>{});
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            const btn = document.getElementById('fullscreenBtn');
            if (document.fullscreenElement || document.webkitFullscreenElement) btn.style.display = 'none';
            else if (isAppStarted) btn.style.display = 'block';
        }

        function startApp() {
            enterFullscreen();
            document.getElementById('startScreen').style.display = 'none'; 
            isAppStarted = true; 
            startMedia(); requestWakeLock(); resetCatalogTimer();
            setTimeout(handleFullscreenChange, 500);
        }

        socket.on('updateSettings', (settings) => { 
            if (settings.background) document.getElementById('layoutBg').style.backgroundImage = `url('${settings.background}')`; 
            if (settings.promoIdleTime) idleDelay = settings.promoIdleTime * 1000;
            resetCatalogTimer();
        });
        
        socket.on('updateCatalog', (items) => { document.getElementById('catalog').innerHTML = items.map(item => `<div class="card"><img src="${item.image}"><h3>${item.name}</h3></div>`).join(''); });
        socket.on('updatePromo', (items) => { promoItems = items; resetCatalogTimer(); });

        socket.on('triggerPromoNow', () => { clearTimeout(catalogTimer); startPromo(); });
        socket.on('stopPromoNow', () => { resetCatalogTimer(); });
        socket.on('skipPromoNow', () => {
            if (!isPromoActive) return;
            clearTimeout(imageTimer);
            const vidEl = document.getElementById('promoVideo');
            if(!vidEl.paused) vidEl.pause();
            promoIndex++;
            playNextPromo();
        });

        function resetCatalogTimer() {
            if (!isAppStarted) return;
            isPromoActive = false;
            clearTimeout(catalogTimer); clearTimeout(imageTimer);
            document.getElementById('promoContainer').style.display = 'none';
            document.getElementById('promoVideo').pause();
            
            if (promoItems.length > 0) catalogTimer = setTimeout(startPromo, idleDelay); 
        }

        function startPromo() {
            if (promoItems.length === 0) return;
            isPromoActive = true;
            document.getElementById('promoContainer').style.display = 'block';
            promoIndex = 0;
            playNextPromo();
        }

        function playNextPromo() {
            if (!isPromoActive) return;
            if (promoIndex >= promoItems.length) { resetCatalogTimer(); return; }
            
            const item = promoItems[promoIndex], imgEl = document.getElementById('promoImg'), vidEl = document.getElementById('promoVideo');
            if (item.type === 'video') {
                imgEl.style.display = 'none'; vidEl.src = item.url; vidEl.style.display = 'block';
                vidEl.play(); vidEl.onended = () => { promoIndex++; playNextPromo(); };
            } else {
                vidEl.pause(); vidEl.style.display = 'none'; imgEl.src = item.url; imgEl.style.display = 'block';
                // Atualizado: Puxa o tempo configurado da mídia individual (converte para milissegundos)
                const displayTime = (item.duration || 10) * 1000;
                imageTimer = setTimeout(() => { promoIndex++; playNextPromo(); }, displayTime);
            }
        }

        function startMedia() {
            const video = document.getElementById('video'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }).then(stream => {
                video.srcObject = stream;
                setInterval(() => {
                    if(!isAppStarted) return;
                    canvas.width = video.videoWidth / 2; canvas.height = video.videoHeight / 2;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    socket.emit('videoFrame', canvas.toDataURL('image/jpeg', 0.4));
                }, 200); 
            }).catch(e => {});
        }
    </script>
</body>
</html>
